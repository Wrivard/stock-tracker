appId: quebec.kua.stock-tracker
productName: Beta Trading Hub
copyright: Copyright © 2026 Wrivard
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# Auto-updater channel: latest releases live on GitHub. `npm run release`
# bumps version, builds, and uploads the artifacts (needs GH_TOKEN with
# `repo` scope, or an authenticated `gh` CLI).
publish:
  - provider: github
    owner: Wrivard
    repo: stock-tracker
    releaseType: release

win:
  # We ship NSIS only. A portable target was tried and dropped because the
  # portable launcher extracts to %LOCALAPPDATA%\Temp, which on this user's
  # machine carries the Anthropic Codex Sandbox ACL (AppContainer SID with
  # FullControl) that crashes Chromium's renderer process at startup.
  # NSIS with a custom installer.nsh redirects $INSTDIR to %USERPROFILE%
  # which is outside the sandboxed tree — auto-update keeps working there.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: "${productName}-${version}-setup.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Finance
